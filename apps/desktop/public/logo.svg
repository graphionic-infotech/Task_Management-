<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="g-grad-main" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="g-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Hexagon / Rounded Shield -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#0b1329" stroke="url(#g-grad-main)" stroke-width="2.5" />
  
  <!-- Subtle graph grid overlay -->
  <path d="M28 60 H92 M60 28 V92" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Graphionic Stylized 'G' with Nodes & Data Paths -->
  <!-- Outer G loop -->
  <path d="M78 36 C70 28 50 28 40 38 C28 50 28 70 40 82 C52 94 72 92 80 82 C86 74 86 64 86 62 H58" 
        stroke="url(#g-grad-main)" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Accent Inner Flow Line -->
  <path d="M58 62 H86" 
        stroke="url(#g-grad-accent)" 
        stroke-width="8.5" 
        stroke-linecap="round" />

  <!-- Graph Nodes (Graphionic Tech Identity) -->
  <circle cx="78" cy="36" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="40" cy="38" r="4.5" fill="#60a5fa" />
  <circle cx="40" cy="82" r="4.5" fill="#818cf8" />
  <circle cx="80" cy="82" r="4.5" fill="#a78bfa" />
  <circle cx="86" cy="62" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="58" cy="62" r="3.5" fill="#ffffff" />
</svg>
