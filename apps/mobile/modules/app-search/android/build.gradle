apply plugin: 'com.android.library'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")

apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

def useManagedAndroidSdkVersions = true
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 21)
      targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
  }
}

android {
  namespace "tech.dongdongbh.mindwtr.appsearch"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Apache-2 licensed, FOSS-safe. PlatformStorage (API 31+) is the AOSP
  // framework-backed AppSearch implementation — no Play-services artifacts.
  implementation("androidx.appsearch:appsearch:1.2.0-alpha01")
  implementation("androidx.appsearch:appsearch-platform-storage:1.2.0-alpha01")
  // The AppSearch async API surface is typed against ListenableFuture. The RN
  // build force-resolves the standalone listenablefuture artifact to the empty
  // 9999 jar because full Guava is already on the app classpath — so depend on
  // Guava itself; it adds nothing to the APK.
  implementation("com.google.guava:guava:33.3.1-android")
}
